name: crypto_matrix
description: Crypto Matrix companion app
publish_to: 'none'

version: 0.0.1+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  app_settings: ^9.0.1
  carousel_slider: ^5.1.2
  cupertino_icons: ^2.0.0
  flutter_cache_manager: ^3.4.5
  flutter_reactive_ble: ^5.6.0
  http: ^1.6.0
  intl: ^0.20.3
  permission_handler: ^13.0.2
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icon/icon.png"

flutter:
  uses-material-design: true

  assets:
    - assets/coins/
    - assets/network/
    - assets/bluetooth/
